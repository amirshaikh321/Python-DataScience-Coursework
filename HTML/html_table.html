<html lang="en">

        th, td{border : 3px solid red}

</head>

            </tr>
            <tr>
                <td>102</td>
                <td>Rohan</td>
                <td>123456</td>
                <td>30000</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Roshni</td>

            </tr>
        </tbody>
        </table>
    </center>
</body>
</html>
