<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GET POST</title>
</head>
<body style="background-color: aqua; border: 50px; border-color: red;">
    <form method="get" action="#" >Enter SID:
        <input type="number" placeholder="Enter Student ID" name="sid"><hr>
        Student Name: <input type="text"><hr>
        DOB: <input type="date"><hr>
        Email: <input type="email"><hr>
        <span style="color: red;">Password</span><input type="'password"><hr>
        Course: <input type="checkbox" value="Python" name="co">Python
        <input type="checkbox" value="Java" name="co">Java
        <input type="checkbox" value="Data Science" name="co">Data Science
        <input type="checkbox" value="Data Analyst" name="co">Data Analyst<hr>

        Gender: <input type="radio" name="gender">Male<input type="radio" name="gender">Female
        <hr>
        City:
        <select name="City">
            <option>Pune</option>
            <option>Mumbai</option>
            <option>Bengaluru</option>
        </select>
        <hr>
        Feedback: <textarea name="Feedback" cols="4" rows="5">Write your Thoughts</textarea>
        <hr>
        Range: <input type="range" name="range" min="0" max="100">
        <hr>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
