<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee in html</title>
</head>
<body>
    <center>
        <h1>marquee</h1>
        <marquee
        behavior = "scroll"
        direction = "right"
        scrollamount = 30>
            Slow Scrolling
        </marquee>
    </center>
</body>
</html>
